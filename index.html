			<button type="submit">Unlock</button>

		<script>
// The game's data is encrypted (tests/web_lock.js) and only opens with the password.
// The file is laid out as: 16 bytes of salt, 12 of IV, then the AES-GCM ciphertext.
(function () {
	const SAVED = 'chomp-password';
	const ROUNDS = 200000;
	const plainFetch = window.fetch.bind(window);

	function saved() {
		try {
			return localStorage.getItem(SAVED);
		} catch (err) {
			return null;
		}
	}

	function remember(password) {
		try {
			if (password === null) {
				localStorage.removeItem(SAVED);
			} else {
				localStorage.setItem(SAVED, password);
			}
		} catch (err) {
			// Private browsing: it just asks again next time.
		}
	}

	function ask(wrong) {
		const form = document.getElementById('lock');
		const box = document.getElementById('lock-password');
		document.getElementById('lock-wrong').textContent = wrong ? 'That password is not right.' : '';
		box.value = '';
		form.classList.add('open');
		return new Promise((resolve) => {
			form.addEventListener('submit', (event) => {
				event.preventDefault();
				form.classList.remove('open');
				resolve(box.value);
			}, { once: true });
		});
	}

	async function open(data, password) {
		const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
		const key = await crypto.subtle.deriveKey(
			{ name: 'PBKDF2', hash: 'SHA-256', salt: data.subarray(0, 16), iterations: ROUNDS },
			material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
		return crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.subarray(16, 28) }, key, data.subarray(28));
	}

	window.fetch = async function (input, init) {
		const url = typeof input === 'string' ? input : String(input.url || input);
		if (!url.split('?')[0].endsWith('.pck')) {
			return plainFetch(input, init);
		}
		const response = await plainFetch(input, init);
		if (!response.ok) {
			return response;
		}
		const data = new Uint8Array(await response.arrayBuffer());
		let password = saved();
		let wrong = false;
		for (;;) {
			if (password === null) {
				password = await ask(wrong);
			}
			try {
				const plain = await open(data, password);
				remember(password);
				return new Response(plain, { status: 200, headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(plain.byteLength) } });
			} catch (err) {
				remember(null);
				password = null;
				wrong = true;
			}
		}
	};
}());

// The notch and home bar, as fractions of the screen: left, top, right, bottom.
window.chompSafeArea = function () {
	const style = getComputedStyle(document.documentElement);
	const inset = (name) => parseFloat(style.getPropertyValue(name)) || 0;
	const w = window.innerWidth;
	const h = window.innerHeight;
	return [inset('--safe-left') / w, inset('--safe-top') / h, inset('--safe-right') / w, inset('--safe-bottom') / h].join(',');
};

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":559088,"index.wasm":32537295},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
